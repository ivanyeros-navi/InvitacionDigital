<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY BIRTHDAY - 2000's Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap');

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .title-font {
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 0.1em;
        }

        /* Y2K Chrome Liquid Background Animation */
        .chrome-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a1a24 0%, #000000 100%);
            z-index: -2;
        }

        .liquid-blob {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #a8a8b8 20%, #4a4a5a 60%, #111 100%);
            border-radius: 50%;
            filter: blur(15px) contrast(20);
            mix-blend-mode: screen;
            opacity: 0.6;
            animation: float 15s infinite alternate ease-in-out;
        }

        .blob1 { width: 300px; height: 300px; top: -10%; left: -10%; }
        .blob2 { width: 400px; height: 400px; bottom: -20%; right: -10%; animation-delay: -5s; }
        .blob3 { width: 200px; height: 200px; top: 40%; left: 50%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        /* Y2K Sparkles */
        .sparkle {
            position: absolute;
            width: 40px;
            height: 40px;
            background: 
                radial-gradient(circle, #fff 10%, transparent 20%),
                linear-gradient(45deg, transparent 40%, #fff 45%, #fff 55%, transparent 60%),
                linear-gradient(-45deg, transparent 40%, #fff 45%, #fff 55%, transparent 60%);
            filter: drop-shadow(0 0 10px #fff);
            animation: twinkle 3s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(90deg); }
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.05);
            border-radius: 24px;
        }

        /* Chrome Text Effect */
        .chrome-text {
            background: linear-gradient(to bottom, #ffffff 0%, #b3b3b3 40%, #4d4d4d 50%, #e6e6e6 60%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
        }

        /* Custom Input */
        .chrome-input {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            transition: all 0.3s ease;
        }
        .chrome-input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* Custom Scrollbar for Songs */
        .songs-container::-webkit-scrollbar { width: 6px; }
        .songs-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .songs-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 relative">

    <!-- Background Elements -->
    <div class="chrome-bg"></div>
    <div class="liquid-blob blob1"></div>
    <div class="liquid-blob blob2"></div>
    <div class="liquid-blob blob3"></div>
    
    <div class="sparkle" style="top: 15%; left: 10%;"></div>
    <div class="sparkle" style="top: 25%; right: 15%; transform: scale(1.5);"></div>
    <div class="sparkle" style="bottom: 20%; left: 20%;"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md z-10 space-y-8">
        
        <!-- Header -->
        <div class="text-center space-y-2 mt-4">
            <h1 class="text-4xl md:text-5xl font-bold title-font chrome-text tracking-widest">MY BIRTHDAY</h1>
        </div>

        <!-- Poster Flyer -->
        <div class="glass-panel p-2 relative overflow-hidden group border-2 border-gray-400">
            <img id="invitation-image" src="./invitacion.jpg" alt="Poster 2000s Party" class="w-full h-auto rounded-xl object-cover shadow-2xl" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1000&auto=format&fit=crop';">
        </div>

        <!-- Event Details -->
        <div class="glass-panel p-6 space-y-6">
            <!-- Countdown -->
            <div class="grid grid-cols-4 gap-2 text-center border-b border-gray-600 pb-6">
                <div class="flex flex-col"><span id="days" class="text-2xl font-bold title-font">00</span><span class="text-xs text-gray-400">DÍAS</span></div>
                <div class="flex flex-col"><span id="hours" class="text-2xl font-bold title-font">00</span><span class="text-xs text-gray-400">HRS</span></div>
                <div class="flex flex-col"><span id="minutes" class="text-2xl font-bold title-font">00</span><span class="text-xs text-gray-400">MIN</span></div>
                <div class="flex flex-col"><span id="seconds" class="text-2xl font-bold title-font">00</span><span class="text-xs text-gray-400">SEG</span></div>
            </div>

            <!-- Info -->
            <div class="space-y-4 text-center">
                <div class="flex items-center justify-center space-x-3">
                    <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-lg tracking-wide">3 de Octubre</span>
                </div>
                <div class="flex items-center justify-center space-x-3">
                    <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-lg tracking-wide">6:00 p.m.</span>
                </div>
                <div class="flex items-center justify-center space-x-3 text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Salvador Allende #115</span>
                </div>
            </div>

            <!-- Location Button -->
            <a href="https://maps.google.com/?q=Salvador+Allende+115" target="_blank" class="block w-full py-3 rounded-xl font-bold tracking-widest text-center transition-all bg-white text-black hover:bg-gray-200">
                VER UBICACIÓN EN MAPS
            </a>
        </div>

        <!-- Spotify Section -->
        <div class="glass-panel p-6 space-y-5">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-[#1DB954]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.84.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.84.241 1.2zM19.08 10.5c-3.96-2.34-10.44-2.58-14.16-1.44-.6.18-1.2-.12-1.38-.72-.18-.6.12-1.2.72-1.38 4.32-1.26 11.28-1.02 15.72 1.62.54.3.72.96.42 1.5-.24.54-.84.72-1.32.42z"/></svg>
                <h2 class="text-xl font-bold title-font">MÚSICA PARA LA FIESTA</h2>
            </div>
            
            <p class="text-sm text-gray-300">¡Agrega tus canciones favoritas a la lista! Se guardarán automáticamente.</p>
            
            <form id="song-form" class="space-y-4" onsubmit="event.preventDefault();">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="song-title" placeholder="Nombre de la canción" class="chrome-input w-full px-4 py-3 rounded-xl text-sm" required>
                    <input type="text" id="song-artist" placeholder="Artista" class="chrome-input w-full px-4 py-3 rounded-xl text-sm" required>
                </div>
                <button type="submit" id="submit-song-btn" class="w-full py-3 rounded-xl font-bold text-sm tracking-widest bg-transparent border border-gray-400 text-white hover:bg-white hover:text-black transition-all">
                    <span class="text-green-500 mr-2">+</span> SUGERIR CANCIÓN
                </button>
            </form>

            <div class="mt-6 border-t border-gray-600 pt-4">
                <h3 class="text-xs text-gray-400 font-bold tracking-widest mb-3 uppercase">Canciones Agregadas:</h3>
                <div id="songs-list" class="songs-container max-h-48 overflow-y-auto space-y-2 pr-2">
                    <div class="text-sm text-gray-500 italic">Cargando canciones...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Countdown Logic -->
    <script>
        const targetDate = new Date("October 3, 2026 18:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            if (distance < 0) return;
            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }, 1000);
    </script>

    <!-- Firebase Logic (Con credenciales reales integradas) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // TUS CREDENCIALES REALES
        const firebaseConfig = {
            apiKey: "AIzaSyDniABzb2Whs4jT0auobisunFdjRwjihzQ",
            authDomain: "cumple-794d5.firebaseapp.com",
            databaseURL: "https://cumple-794d5-default-rtdb.firebaseio.com",
            projectId: "cumple-794d5",
            storageBucket: "cumple-794d5.firebasestorage.app",
            messagingSenderId: "44968397243",
            appId: "1:44968397243:web:adca4351442f553cb91c9e",
            measurementId: "G-PGR1C6SSCV"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const songsRef = ref(database, 'songs');

        // Form elements
        const form = document.getElementById('song-form');
        const submitBtn = document.getElementById('submit-song-btn');
        const titleInput = document.getElementById('song-title');
        const artistInput = document.getElementById('song-artist');
        const songsList = document.getElementById('songs-list');

        // Escuchar "Submit"
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Detiene el refresh
            
            const title = titleInput.value.trim();
            const artist = artistInput.value.trim();
            
            if (title && artist) {
                // Estado de carga
                submitBtn.innerHTML = 'Guardando...';
                submitBtn.disabled = true;
                
                try {
                    // Enviar a la base de datos
                    await push(songsRef, {
                        title: title,
                        artist: artist,
                        timestamp: Date.now()
                    });
                    
                    // Limpiar formulario y dar feedback
                    titleInput.value = '';
                    artistInput.value = '';
                    submitBtn.innerHTML = '<span class="text-green-500 mr-2">✓</span> ¡AGREGADA!';
                    
                    setTimeout(() => {
                        submitBtn.innerHTML = '<span class="text-green-500 mr-2">+</span> SUGERIR CANCIÓN';
                        submitBtn.disabled = false;
                    }, 2000);
                } catch (error) {
                    console.error("Error al guardar:", error);
                    submitBtn.innerHTML = 'Error de conexión';
                    submitBtn.disabled = false;
                    alert("Ocurrió un error al guardar. Revisa tu internet o intenta de nuevo.");
                }
            }
        });

        // Escuchar cambios en la lista de canciones en tiempo real
        onValue(songsRef, (snapshot) => {
            songsList.innerHTML = ''; // Limpiar lista
            const data = snapshot.val();
            
            if (data) {
                // Convertir el objeto a array y ordenar por fecha
                const songsArray = Object.values(data).sort((a, b) => b.timestamp - a.timestamp);
                
                songsArray.forEach(song => {
                    const songDiv = document.createElement('div');
                    songDiv.className = 'flex items-center space-x-3 p-2 bg-white/5 rounded-lg border border-white/10';
                    songDiv.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-[#1DB954]/20 flex items-center justify-center flex-shrink-0">
                            <svg class="w-4 h-4 text-[#1DB954]" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <div class="flex-1 truncate">
                            <p class="text-sm font-bold text-white truncate">${song.title}</p>
                            <p class="text-xs text-gray-400 truncate">${song.artist}</p>
                        </div>
                    `;
                    songsList.appendChild(songDiv);
                });
            } else {
                songsList.innerHTML = '<div class="text-sm text-gray-500 italic">Aún no hay canciones, ¡sé el primero en sugerir una!</div>';
            }
        });
    </script>
</body>
</html>
